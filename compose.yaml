services:
  mongodb:
    image: mongo:7.0
    container_name: flymanager-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PUBLISHED_HOST:-127.0.0.1}:${MONGO_PUBLISHED_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb2:
    image: mongo:7.0
    container_name: flymanager-mongodb2
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data2:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    container_name: flymanager-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb2:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        mongosh --host mongodb:27017 --eval '
        try { rs.status(); }
        catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongodb:27017", priority: 2 },
              { _id: 1, host: "mongodb2:27017", priority: 1 }
            ]
          });
        }'

  mongo-backup:
    image: rclone/rclone:latest
    container_name: flymanager-mongo-backup
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - mongo_backups:/backups
      - ./scripts/container-mongo-backup.sh:/usr/local/bin/container-mongo-backup.sh:ro
      - ${RCLONE_CONFIG_PATH:-./scripts/rclone.conf}:/config/rclone/rclone.conf:ro
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      HEALTHCHECK_UUID: ${HEALTHCHECK_UUID:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        apk add --no-cache mongodb-tools bash curl > /dev/null 2>&1 &&
        chmod +x /usr/local/bin/container-mongo-backup.sh || true &&
        /usr/local/bin/container-mongo-backup.sh &&
        while true; do sleep "${MONGO_BACKUP_INTERVAL_SECONDS:-21600}"; /usr/local/bin/container-mongo-backup.sh; done
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    container_name: flymanager-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  app: &app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flymanager-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ${FLYMANAGER_ENV_FILE:-.env}
    environment: &app-environment
      # Pinned to the bundled replica set (not ${MONGO_URI:-...}) on purpose:
      # Compose auto-loads .env for interpolation, so a stale MONGO_URI left in a
      # developer's .env would otherwise shadow the default and crash the app
      # against a dead remote cluster. `environment:` outranks `env_file:`, so
      # this literal always wins for the local stack. Remote/production DBs are
      # configured through compose.production.yaml / compose.synology.yaml.
      MONGO_URI: mongodb://mongodb:27017,mongodb2:27017/?replicaSet=rs0
      MONGO_DB_NAME: flymanager
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Match production: RQ uses DB 0 while server-side sessions live in DB 1.
      # Keeping this explicit avoids silently benchmarking filesystem sessions.
      SESSION_TYPE: redis
      SESSION_REDIS_URL: redis://redis:6379/1
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-5234}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      WAIT_FOR_MONGO: ${WAIT_FOR_MONGO:-1}
      WAIT_FOR_MONGO_TIMEOUT: ${WAIT_FOR_MONGO_TIMEOUT:-60}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-1}
      SOCKETIO_ASYNC_MODE: ${SOCKETIO_ASYNC_MODE:-threading}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-data/uploads}
      SESSION_FILE_DIR: ${SESSION_FILE_DIR:-/tmp/flymanager/flask_session}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-8388608}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
    expose:
      - "5234"
    ports:
      - "${APP_PUBLISHED_HOST:-127.0.0.1}:${APP_PORT:-5234}:5234"
    volumes: &app-volumes
      - ./data:/app/data
      - ./flask_session:/tmp/flymanager/flask_session
      - ./flymanager/app/static/generated_labels:/app/flymanager/app/static/generated_labels
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5234/health/ready', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    container_name: flymanager-worker
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *app-environment
      ENABLE_SCHEDULER: "0"
    ports: []
    expose: []
    volumes: *app-volumes
    entrypoint: ["./docker/worker-entrypoint.sh"]
    command: ["python", "-m", "flymanager.app.worker"]
    healthcheck:
      disable: true

volumes:
  mongo_data:
  mongo_data2:
  mongo_backups:
  redis_data:
