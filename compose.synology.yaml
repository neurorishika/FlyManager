# Portainer stack file for Synology NAS deployment
#
# Heavy admin actions (Excel export, phenotype/provider cache backfills,
# FlyBase/Bloomington data refreshes) run in a separate "worker" container
# via Redis-backed RQ, so they never block the web app. The worker uses the
# same image as the app, just with a different entrypoint/command - no
# separate build/push step needed for it.
#
# Prerequisites:
#   1. Build and push the image from your dev machine:
#        docker build -t YOUR_DOCKERHUB_USER/flymanager:latest .
#        docker push YOUR_DOCKERHUB_USER/flymanager:latest
#
#   2. On your Synology, create the data directories:
#        /volume1/docker/flymanager/data/uploads
#        /volume1/docker/flymanager/data/backup
#        /volume1/docker/flymanager/data/job_exports
#        /volume1/docker/flymanager/data/flybase
#      and the file /volume1/docker/flymanager/data/bloomington.csv must exist
#      (an empty file is fine) -- Docker creates a DIRECTORY in its place if it
#      does not, and the app then fails to read it.
#        /volume1/docker/flymanager/flask_session
#        /volume1/docker/flymanager/generated_labels
#        /volume1/docker/flymanager/backups
#        /volume1/docker/flymanager/scripts
#
#   3. Upload these two repo files into /volume1/docker/flymanager/scripts/
#      on the NAS (e.g. via File Station or scp) - there is no git checkout
#      on the NAS in the Portainer deployment model, so these must be
#      copied in manually and re-copied whenever they change:
#        scripts/container-mongo-backup.sh
#        scripts/rclone.conf (copy from scripts/rclone.conf.example and
#          fill in real rclone remote credentials once you're ready to
#          enable off-site backup push - leave it as the unmodified
#          example content, renamed to rclone.conf, until then)
#
#   4. In Portainer → Stacks → Add Stack, paste this file and
#      fill in the environment variables listed below.
#
# After deploying, set up a Reverse Proxy rule in Synology DSM:
#   Control Panel → Application Portal → Reverse Proxy
#   Source: https  your-nas-domain.com  443
#   Destination: http  localhost  12754
#
# Required environment variables to set in Portainer:
#   SECRET_KEY          — long random string, e.g. from: openssl rand -hex 32
#   FLYMANAGER_ADMIN_USERNAME
#   FLYMANAGER_ADMIN_PASSWORD
#   FLYMANAGER_ADMIN_INITIALS
#   APP_IMAGE           — e.g. YOUR_DOCKERHUB_USER/flymanager:latest

services:
  mongodb:
    image: mongo:7.0
    container_name: flymanager-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:12753:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb2:
    image: mongo:7.0
    container_name: flymanager-mongodb2
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data2:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    container_name: flymanager-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb2:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        mongosh --host mongodb:27017 --eval '
        try { rs.status(); }
        catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongodb:27017", priority: 2 },
              { _id: 1, host: "mongodb2:27017", priority: 1 }
            ]
          });
        }'

  mongo-backup:
    image: rclone/rclone:latest
    container_name: flymanager-mongo-backup
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    volumes:
      # A bind mount, not a named volume: backups in a Docker volume live in
      # the same storage as mongo_data, so "remove stack and volumes" or a
      # volume prune destroys the database and every backup of it together.
      - /volume1/docker/flymanager/backups:/backups
      - /volume1/docker/flymanager/scripts/container-mongo-backup.sh:/usr/local/bin/container-mongo-backup.sh:ro
      # NOT read-only: rclone refreshes its OAuth access token and writes the
      # result back, and a :ro mount makes every run log "Failed to save config
      # after 10 tries". It still works today because the refresh token is
      # reused each run, but a token rotation would be lost and the push would
      # start failing silently.
      - ${RCLONE_CONFIG_PATH:-/volume1/docker/flymanager/scripts/rclone.conf}:/config/rclone/rclone.conf
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      MONGO_BACKUP_INTERVAL_SECONDS: ${MONGO_BACKUP_INTERVAL_SECONDS:-21600}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      HEALTHCHECK_UUID: ${HEALTHCHECK_UUID:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        apk add --no-cache mongodb-tools bash curl > /dev/null 2>&1 &&
        chmod +x /usr/local/bin/container-mongo-backup.sh || true &&
        /usr/local/bin/container-mongo-backup.sh &&
        while true; do sleep "$${MONGO_BACKUP_INTERVAL_SECONDS}"; /usr/local/bin/container-mongo-backup.sh; done
    healthcheck:
      # Freshness, not liveness. The loop keeps running and restarting whatever
      # happens to a dump -- disk full, an auth change, mongodump missing -- so
      # a container that is merely "up" said nothing about whether a backup has
      # been taken this century. Unhealthy once the newest archive is older
      # than twice the interval. BusyBox find in the rclone image lacks
      # GNU find's -newermt, so the backup script records a completion epoch
      # after it has written and checksummed an archive.
      test:
        - CMD-SHELL
        - >
          last_success="$$(cat /backups/.mongo-backup-last-success 2>/dev/null)" &&
          case "$$last_success" in ''|*[!0-9]*) exit 1 ;; esac &&
          now="$$(date +%s)" &&
          max_age="$$(( $${MONGO_BACKUP_INTERVAL_SECONDS} * 2 ))" &&
          [ "$$now" -ge "$$last_success" ] &&
          [ "$$((now - last_success))" -le "$$max_age" ]
      interval: 30m
      timeout: 30s
      retries: 2
      start_period: 10m

  redis:
    image: redis:7-alpine
    container_name: flymanager-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  app: &app
    image: ${APP_IMAGE:?Set APP_IMAGE to your pushed Docker image, e.g. yourdockerhubuser/flymanager:latest}
    container_name: flymanager-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: &app-environment
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a long random string}
      MONGO_URI: mongodb://mongodb:27017,mongodb2:27017/?replicaSet=rs0
      MONGO_DB_NAME: flymanager
      REDIS_URL: redis://redis:6379/0
      SESSION_TYPE: redis
      SESSION_REDIS_URL: redis://redis:6379/1
      APP_HOST: 0.0.0.0
      APP_PORT: "5234"
      FLASK_DEBUG: "0"
      WAIT_FOR_MONGO: "1"
      WAIT_FOR_MONGO_TIMEOUT: "60"
      ENABLE_SCHEDULER: "1"
      SOCKETIO_ASYNC_MODE: threading
      UPLOAD_FOLDER: data/uploads
      MAX_UPLOAD_SIZE_BYTES: "8388608"
      TRUST_PROXY_HEADERS: "1"
      SESSION_COOKIE_SECURE: "0"
      SESSION_COOKIE_SAMESITE: Lax
      SESSION_LIFETIME_SECONDS: "3600"
      ORG_ABV: ${ORG_ABV:-RU}
      FLYMANAGER_ADMIN_USERNAME: ${FLYMANAGER_ADMIN_USERNAME:-}
      FLYMANAGER_ADMIN_PASSWORD: ${FLYMANAGER_ADMIN_PASSWORD:-}
      FLYMANAGER_ADMIN_INITIALS: ${FLYMANAGER_ADMIN_INITIALS:-}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      MAIL_SUPPRESS_SEND: ${MAIL_SUPPRESS_SEND:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "0.0.0.0:12754:5234"
    volumes: &app-volumes
      # Only the MUTABLE paths under /app/data are bind-mounted. Mounting the
      # whole directory shadowed everything the image ships there -- which is
      # how the 2026-08-31 deploy crash-looped: data/markers/catalog.json is
      # baked into the image, invisible under the mount, and create_app raises
      # at import without it. Shipped data must come from the image so it
      # always matches the code; only what the app WRITES belongs on the NAS.
      #   uploads / backup / job_exports -- written by the app and worker
      #   flybase / bloomington.csv      -- refreshed by admin actions
      - /volume1/docker/flymanager/data/uploads:/app/data/uploads
      - /volume1/docker/flymanager/data/backup:/app/data/backup
      - /volume1/docker/flymanager/data/job_exports:/app/data/job_exports
      - /volume1/docker/flymanager/data/flybase:/app/data/flybase
      - /volume1/docker/flymanager/data/bloomington.csv:/app/data/bloomington.csv
      - /volume1/docker/flymanager/flask_session:/tmp/flymanager/flask_session
      - /volume1/docker/flymanager/generated_labels:/app/flymanager/app/static/generated_labels
      # The app writes the daily state backup here (uploads, labels and the
      # encrypted environment) on its own scheduler, so that schedule lives in
      # the stack rather than in a DSM task outside it. The mongo-backup
      # container shares this directory and handles pruning and the off-site
      # push, so the GFS retention rule has exactly one implementation.
      - /volume1/docker/flymanager/backups:/backups
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5234/health/ready', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    container_name: flymanager-worker
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *app-environment
      ENABLE_SCHEDULER: "0"
    ports: []
    volumes: *app-volumes
    entrypoint: ["./docker/worker-entrypoint.sh"]
    command: ["python", "-m", "flymanager.app.worker"]
    healthcheck:
      disable: true

volumes:
  mongo_data:
  mongo_data2:
  redis_data:
