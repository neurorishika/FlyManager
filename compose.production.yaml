services:
  app:
    environment:
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}

  proxy:
    image: caddy:2.8-alpine
    container_name: flymanager-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PUBLISHED_PORT:-80}:80"
      - "${HTTPS_PUBLISHED_PORT:-443}:443"
    environment:
      FLYMANAGER_DOMAIN: ${FLYMANAGER_DOMAIN:?Set FLYMANAGER_DOMAIN in .env before starting production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
