{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h1>Application Settings</h1>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-4">
                            <h3>Theme Settings</h3>
                            <div class="form-group">
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="dark_mode" name="dark_mode" {% if settings.theme.dark_mode %}checked{% endif %}>
                                    <label class="custom-control-label" for="dark_mode">Dark Mode</label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="accent_color">Accent Color</label>
                                <input type="color" class="form-control" id="accent_color" name="accent_color" value="{{ settings.theme.accent_color }}">
                                <small class="form-text text-muted">This color will be used for highlights and buttons</small>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h3>Lab Information</h3>
                            <div class="form-group">
                                <label for="lab_name">Lab Name</label>
                                <input type="text" class="form-control" id="lab_name" name="lab_name" value="{{ settings.lab_info.lab_name }}" required>
                            </div>
                            <div class="form-group">
                                <label for="admin_name">Administrator Name</label>
                                <input type="text" class="form-control" id="admin_name" name="admin_name" value="{{ settings.lab_info.admin_name }}" required>
                            </div>
                            <div class="form-group">
                                <label for="admin_email">Administrator Email</label>
                                <input type="email" class="form-control" id="admin_email" name="admin_email" value="{{ settings.lab_info.admin_email }}" required>
                            </div>
                        </div>

                        <div class="text-right">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Settings
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
