{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block head %}
<style>
    .auth-container {
        background-color: var(--card-bg);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
    }
    .auth-container h2 {
        margin-bottom: 25px;
        text-align: center;
        font-weight: 700;
        color: var(--header-bg);
    }
    .auth-container label {
        font-weight: 500;
    }
    .auth-container .form-control {
        border-radius: 25px;
    }
    .auth-container .btn {
        border-radius: 25px;
        font-weight: 700;
    }
    .error-message {
        color: red;
        text-align: center;
        margin-bottom: 15px;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Forgot Password</h2>
    {% if message %}
        <p class="error-message">{{ message }}</p>
    {% endif %}
    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <div class="form-group">
            <label for="username">Username:</label>
            <select class="form-control" id="username" name="username" required>
                <option value="" disabled selected>Select your username</option>
                {% for user in users %}
                    <option value="{{ user }}">{{ user }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="master_password">Master Password:</label>
            <input type="password" class="form-control" id="master_password" name="master_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password:</label>
            <input type="password" class="form-control" id="new_password" name="new_password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Change Password</button>
        <div class="text-center mt-3">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </div>
    </form>
</div>
{% endblock %}
